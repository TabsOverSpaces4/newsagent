name: Daily digest

on:
  schedule:
    # 15:07 UTC = 8:07am PDT (7:07am PST in winter). Minute offset off the
    # hour reduces GitHub cron queue delay.
    - cron: "7 15 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the already-sent check"
        type: boolean
        default: false
      dry_run:
        description: "Dry run (write preview artifact, send nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          REPLY_TO: ${{ secrets.REPLY_TO }}
          FEEDBACK_WORKER_URL: ${{ secrets.FEEDBACK_WORKER_URL }}
          FEEDBACK_HMAC_SECRET: ${{ secrets.FEEDBACK_HMAC_SECRET }}
          FEEDBACK_EXPORT_SECRET: ${{ secrets.FEEDBACK_EXPORT_SECRET }}
        run: >
          python -m digest
          ${{ inputs.dry_run == true && '--dry-run' || '' }}
          ${{ inputs.force == true && '--force' || '' }}

      - name: Upload preview on dry run
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: out/

      # Committing state/digest.db daily also keeps the repo active, so the
      # schedule survives GitHub's 60-day inactivity cutoff.
      - name: Commit state back
        if: always()
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/digest.db
          if ! git diff --cached --quiet; then
            git commit -m "chore: update digest state [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
